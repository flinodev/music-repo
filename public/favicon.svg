<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="800" height="800">
  <!-- Círculo azul brillante en lugar del azul marino del avatar de YouTube:
       a 16px en la barra de pestañas oscura el azul marino se perdía. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a8cff"/>
      <stop offset="1" stop-color="#1158d1"/>
    </linearGradient>
  </defs>
  <circle cx="512" cy="512" r="496" fill="url(#bg)"/>
  <!-- Notas un 20% más grandes para que se lean en tamaños chicos. El borde
       derecho de cada plica es tangente al punto más ancho de su cabeza
       (elipse rotada -24°), así la plica fluye hacia la curva. -->
  <g transform="translate(512 512) scale(1.2) translate(-520 -508)">
    <g fill="#ffffff">
      <rect x="424.2" y="318" width="40" height="358.6"/>
      <rect x="716.2" y="262" width="40" height="360.6"/>
      <ellipse cx="372" cy="694" rx="96" ry="70" transform="rotate(-24 372 694)"/>
      <ellipse cx="664" cy="640" rx="96" ry="70" transform="rotate(-24 664 640)"/>
    </g>
    <!-- La "~" de music~repo como barra que une las dos notas -->
    <path d="M444.2 336 C 528 250, 608 380, 736.2 282" fill="none" stroke="#bfe3ff" stroke-width="64" stroke-linecap="round"/>
  </g>
</svg>
