<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".4" r=".6">
      <stop offset="0" stop-color="#16264a"/>
      <stop offset="1" stop-color="#0b1222"/>
    </radialGradient>
    <linearGradient id="tilde" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#008fec"/>
      <stop offset="1" stop-color="#4fb3ff"/>
    </linearGradient>
  </defs>
  <circle cx="512" cy="512" r="496" fill="url(#bg)"/>
  <!-- El borde derecho de cada plica es tangente al punto más ancho de su
       cabeza (elipse rotada -24°), así la plica fluye hacia la curva. -->
  <g fill="#ffffff">
    <rect x="424.2" y="318" width="40" height="358.6"/>
    <rect x="716.2" y="262" width="40" height="360.6"/>
    <ellipse cx="372" cy="694" rx="96" ry="70" transform="rotate(-24 372 694)"/>
    <ellipse cx="664" cy="640" rx="96" ry="70" transform="rotate(-24 664 640)"/>
  </g>
  <!-- La "~" de music~repo como barra que une las dos notas -->
  <path d="M444.2 336 C 528 250, 608 380, 736.2 282" fill="none" stroke="url(#tilde)" stroke-width="64" stroke-linecap="round"/>
</svg>
